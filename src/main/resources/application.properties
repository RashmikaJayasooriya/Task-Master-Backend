spring.application.name=task_master
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3307/task_master
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=none

# Keycloak properties
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.scope=openid
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

# Keycloak properties for ease of use
KEYCLOAK_SERVER_URL=http://localhost:8181
KEYCLOAK_ISSUER_URI=http://localhost:8181/realms/task_master
KEYCLOAK_REALM=task_master
KEYCLOAK_CLIENT_ID=task_master_app
KEYCLOAK_CLIENT_SECRET=ITzFJ7jwp9jR9zomEDce0TgJXmce7vMI
KEYCLOAK_ADMIN_USERNAME=rashmika
KEYCLOAK_ADMIN_PASSWORD=rashmika

# Swagger properties
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
